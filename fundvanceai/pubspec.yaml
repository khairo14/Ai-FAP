name: fundvanceai
description: FundVance AI - AI-powered financial assistant and expense tracking app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Backend & Database
  supabase_flutter: ^2.3.4
  
  # HTTP & Network
  dio: ^5.4.0
  
  # Local Storage
  flutter_secure_storage: ^10.0.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  
  # Date & Time
  intl: ^0.20.2
  
  # Navigation
  go_router: ^17.1.0
  
  # Forms & Validation
  flutter_form_builder: ^10.3.0+1
  form_builder_validators: ^11.3.0
  
  # Charts
  fl_chart: ^0.70.1
  
  # Phase 2: Receipt Scanner & AI
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0

  # Phase 5: PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

